[project]
name = "JaxPlayground"
version = "0.0.1"
description = "The place to try out JaX things!"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "Jorgvt", email = "vila_tronik@hotmail.com"},
]
keywords = ["jax", "flax", "deep-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "jax",
    "jaxlib",
    "flax",
    "optax",
]

[project.optional-dependencies]
dev = [
    "wandb",
    "tensorflow",
    "clu",
    "ml_collections",
    "einops",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["JaxPlayground"]