[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "JaxPlayground"
version = "0.0.1"
description = "The place to try out JaX things!"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [
  {name = "Jorgvt", email = "vila_tronik@hotmail.com"},
]
keywords = ["nbdev", "jupyter", "notebook", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "jax",
    "jaxlib",
    "flax",
    "optax",
    "nbdev",
    "fastcore",
]

[project.optional-dependencies]
dev = [
    "wandb",
    "tensorflow",
]

[project.urls]
Homepage = "https://github.com/Jorgvt/JaxPlayground"

[tool.nbdev]
lib_name = "JaxPlayground"
repo = "JaxPlayground"
branch = "main"
user = "Jorgvt"
author = "Jorgvt"
author_email = "vila_tronik@hotmail.com"
description = "The place to try out JaX things!"
keywords = "nbdev jupyter notebook python"
language = "English"
status = "3"
license = "apache2"
min_python = "3.7"
nbs_path = "Notebooks"
lib_path = "JaxPlayground"
doc_path = "_docs"
recursive = "True"
tst_flags = "notest"
put_version_in_init = "True"
doc_host = "https://Jorgvt.github.io"
doc_baseurl = "/JaxPlayground"
git_url = "https://github.com/Jorgvt/JaxPlayground"
title = "JaxPlayground"

[project.entry-points."nbdev"]
JaxPlayground = "JaxPlayground._modidx:d"
